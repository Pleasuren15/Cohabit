version: 2

updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      dotnet-runtime:
        patterns:
          - "Microsoft.AspNetCore.*"
          - "Microsoft.EntityFrameworkCore.*"
          - "Microsoft.Extensions.*"
      aspire:
        patterns:
          - "Aspire.*"

  - package-ecosystem: "npm"
    directory: "/src/cohabit.web"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      react-ecosystem:
        patterns:
          - "react"
          - "react-dom"
          - "react-router-*"

  - package-ecosystem: "npm"
    directory: "/src/cohabit.story"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
